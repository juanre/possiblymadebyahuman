name: Promote reviewed image

on:
  workflow_dispatch:
    inputs:
      digest:
        description: Reviewed image index digest to deploy as latest
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote the exact multi-platform image
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          SOURCE_DIGEST: ${{ inputs.digest }}
        run: |
          [[ "$SOURCE_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]] || { echo "Invalid image digest"; exit 1; }
          docker buildx imagetools create --tag "$IMAGE:latest" "$IMAGE@$SOURCE_DIGEST"
          docker buildx imagetools inspect "$IMAGE:latest"
