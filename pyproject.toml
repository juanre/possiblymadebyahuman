[project]
name = "pmbah-database-tests"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pgdbm==0.4.1",
    "pytest>=8,<10",
    "pytest-asyncio>=1,<2",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests/database"]
