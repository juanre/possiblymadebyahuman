# PostgreSQL server infrastructure only. pgdbm's pytest fixtures own test databases.
services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "127.0.0.1:${TEST_DB_PORT:-25433}:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres", "-d", "postgres"]
      interval: 1s
      timeout: 5s
      retries: 30
    tmpfs:
      - /var/lib/postgresql/data
